name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Dar permissao ao gradlew
        run: chmod +x DanceBotAndroid/gradlew

      - name: Compilar
        run: cd DanceBotAndroid && ./gradlew assembleDebug --no-daemon

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: DanceBot-apk
          path: DanceBotAndroid/app/build/outputs/apk/debug/app-debug.apk
