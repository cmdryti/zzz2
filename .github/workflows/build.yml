name: Gerar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x DanceBotAndroid/gradlew

    - name: Build Debug APK
      run: cd DanceBotAndroid && ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DanceBot-apk
        path: DanceBotAndroid/app/build/outputs/apk/debug/app-debug.apk
