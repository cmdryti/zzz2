name: Gerar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Encontrar gradlew e Compilar APK
      run: |
        echo "A procurar pelo gradlew no projeto..."
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "ERRO CRITICO: Ficheiro gradlew nao foi encontrado no repositorio!"
          exit 1
        fi
        
        echo "Ficheiro encontrado em: $GRADLEW_PATH"
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        
        chmod +x "$GRADLEW_PATH"
        
        echo "A entrar na pasta do projeto: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        ./gradlew assembleDebug --no-daemon

    - name: Guardar o APK
      uses: actions/upload-artifact@v4
      with:
        name: DanceBot-apk
        path: |
          **/build/outputs/apk/debug/*.apk
