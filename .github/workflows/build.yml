name: Gerar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Verificar estrutura e dar permissao
      run: |
        echo "A procurar pelo gradlew..."
        if [ -f "DanceBotAndroid/gradlew" ]; then
          chmod +x DanceBotAndroid/gradlew
          echo "Encontrado em DanceBotAndroid/gradlew"
        elif [ -f "gradlew" ]; then
          chmod +x gradlew
          echo "Encontrado na raiz"
        else
          echo "ERRO: gradlew nao encontrado! A listar pastas:"
          ls -R
          exit 1
        fi

    - name: Compilar APK
      run: |
        if [ -f "DanceBotAndroid/gradlew" ]; then
          cd DanceBotAndroid && ./gradlew assembleDebug --no-daemon
        else
          ./gradlew assembleDebug --no-daemon
        fi

    - name: Guardar o APK
      uses: actions/upload-artifact@v4
      with:
        name: DanceBot-apk
        path: |
          DanceBotAndroid/app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
